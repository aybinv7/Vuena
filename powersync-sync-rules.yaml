# PowerSync Sync Rules for Vuena ERP Template
# Documentation: https://docs.powersync.com/usage/sync-rules

config:
  edition: 1

bucket_definitions:
  # ==================================================
  # User's Personal Tasks Bucket
  # ==================================================
  # Syncs all tasks created by the authenticated user
  user_tasks:
    # Query parameters - identifies which tasks belong to this bucket
    # Returns task IDs where the user is the creator
    parameters: SELECT id as task_id FROM tasks WHERE created_by = request.user_id()

    # Data to sync for each task in the bucket
    data:
      # Sync the task record
      - SELECT
        id,
        title,
        description,
        status,
        priority,
        due_date,
        created_at,
        updated_at,
        created_by,
        updated_by
        FROM tasks
        WHERE id = bucket.task_id

  # ==================================================
  # Global (Optional - if you want all users to see all tasks)
  # ==================================================
  # Uncomment this section if tasks should be visible to all authenticated users
  # global_tasks:
  #   data:
  #     - SELECT * FROM tasks
