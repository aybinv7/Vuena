name: iOS Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
        default: "staging"
      version:
        description: "Version number (e.g., 1.2.3)"
        required: true
        type: string

env:
  VITE_APP_VERSION: ${{ github.event.inputs.version }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  deploy:
    runs-on: macos-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Configure native projects
        run: pnpm trapeze:${{ github.event.inputs.environment }}
        env:
          VITE_SUPABASE_URL: ${{ secrets[format('{0}_SUPABASE_URL', github.event.inputs.environment == 'production' && 'PROD' || github.event.inputs.environment == 'staging' && 'STAGING' || 'DEV')] }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets[format('{0}_SUPABASE_ANON_KEY', github.event.inputs.environment == 'production' && 'PROD' || github.event.inputs.environment == 'staging' && 'STAGING' || 'DEV')] }}
          VITE_POWERSYNC_URL: ${{ secrets[format('{0}_POWERSYNC_URL', github.event.inputs.environment == 'production' && 'PROD' || github.event.inputs.environment == 'staging' && 'STAGING' || 'DEV')] }}

      - name: Build web assets
        run: pnpm build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CocoaPods
        run: cd ios/App && pod install

      - name: Import certificates
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATES_P12 }}
          p12-password: ${{ secrets.IOS_CERTIFICATES_PASSWORD }}

      - name: Download provisioning profiles
        uses: apple-actions/download-provisioning-profiles@v1
        with:
          bundle-id: ${{ github.event.inputs.environment == 'production' && 'io.aybinv7.vuena' || format('io.aybinv7.vuena.{0}', github.event.inputs.environment) }}
          profile-type: "IOS_APP_STORE"
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Build iOS app
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath App.xcarchive \
            archive

      - name: Export IPA
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath App.xcarchive \
            -exportPath . \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ios/App/App.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-${{ github.event.inputs.environment }}-${{ github.event.inputs.version }}.ipa
          path: ios/App/App.ipa
          retention-days: 90

      - name: Create GitHub Release
        if: github.event.inputs.environment == 'production'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ios-v${{ github.event.inputs.version }}
          name: iOS Release ${{ github.event.inputs.version }}
          body: |
            iOS ${{ github.event.inputs.environment }} release
            Version: ${{ github.event.inputs.version }}
            Build: ${{ github.run_number }}
          files: ios/App/App.ipa
